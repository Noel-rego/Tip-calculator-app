<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitter Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- FIX 1: Corrected Google Fonts URLs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
</header>
    <main>
        <div class="heading">
            <h2>SPLI</h2>
            <h2>TTER</h2>
        </div>
        <div class="maindiv">
          <div class="leftside">
            <label for="bill" >Bill</label>
            <input type="number" id="bill" name="bill" placeholder="                                         0">

           
            <label for="tipvalue">Select Tip %</label>

           <div class="tipdiv">
            <input type="button" value="5%" data-tip="0.05" name="tip-5" id="5%" class="tip">
            <input type="button" value="10%" data-tip="0.1" name="tip-10" id="10%" class="tip">
            <input type="button" value="15%" data-tip="0.15" name="tip-15" id="15%" class="tip">
            <input type="button" value="25%" data-tip="0.25" name="tip-25" id="25%" class="tip">
            <input type="button" value="50%" data-tip="0.5" name="tip-50" id="50%" class="tip">
            <input type="number" placeholder="custom" name="custom" id="custom" class="tipnoncolor">
           </div>
            <div class="invisible">
              <label for="noofpep" >Number of People</label>
              <div class="error">Can't be zero</div>
            </div>
            <!-- try and put the image inside -->
            <input type="number" id="noofpep" name="noofpep" placeholder="                                         0">
          </div>
            <div class="rightside-Display">
                <div class="tipamount">
                    <div class="tiptext">
                        <p class="text">Tip Amount</p>
                        <p class="perp">/ person</p>
                    </div>
                    <div class="value" id="value">$0.00</div>
                </div>
                <div class="totol">
                    <div class="tottext">
                        <p class="text">Total</p>
                        <p class="perp">/ person</p>
                    </div>
                    <div class="value" id="value2">$0.00</div>
                </div>


                <button class="reset" id="reset">Reset</button>
            </div>
        </div>
    </main>
    <footer></footer>
    <script src="first.js"></script>
</body>
</html>
